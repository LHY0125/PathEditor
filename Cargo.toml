[workspace]
resolver = "2"
members = [
    "src/core",
    "src/gui/src-tauri",
    "src/cli",
]
# v6 SQLCipher 风险探针是独立 crate（需要 Perl/OpenSSL 构建链），
# 刻意排除出 workspace，避免污染 `cargo test --workspace`
exclude = ["probes/v6-sqlcipher"]

[workspace.package]
version = "6.1.0"
edition = "2021"
license = "MIT"
authors = ["刘航宇"]
repository = "https://github.com/LHY0125/PathEditor"
